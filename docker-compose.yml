services:
  menu-db:
    image: postgres:16-alpine
    container_name: menu-db
    environment:
      POSTGRES_DB: db_menu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - menu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_menu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: db_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

  svc-menu:
    build:
      context: ./svc-menu
      dockerfile: Dockerfile
    container_name: svc-menu
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://menu-db:5432/db_menu
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    expose:
      - "8081"
    depends_on:
      menu-db:
        condition: service_healthy
    networks:
      - restaurant-network

  svc-orders:
    build:
      context: ./svc-orders
      dockerfile: Dockerfile
    container_name: svc-orders
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/db_orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MENU_SERVICE_URL: http://svc-menu:8081
    expose:
      - "8082"
    depends_on:
      orders-db:
        condition: service_healthy
      svc-menu:
        condition: service_started
    networks:
      - restaurant-network

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway-restaurant
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - svc-menu
      - svc-orders
    networks:
      - restaurant-network

volumes:
  menu-db-data:
  orders-db-data:

networks:
  restaurant-network:
    driver: bridge
